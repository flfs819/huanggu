<style>

}
html, body { height: 100%; }
[hidden] { display: none !important; }

.pnl { background: rgba(38, 34, 29, .94); border: 1px solid var(--edge); border-radius: 3px; box-shadow: 0 2px 10px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,240,200,.05); }
.num { font-variant-numeric: tabular-nums; }

#date { font-weight: 600; letter-spacing: .06em; white-space: nowrap; }

.chip { display: inline-flex; align-items: baseline; gap: 4px; white-space: nowrap; cursor: default; }

.chip b { font-weight: 600; } .chip span { color: var(--dim); font-size: 12px; } .chip.low b { color: var(--madder); }
#ctl { display: flex; gap: 3px; flex-wrap: wrap; }
#ctl button { padding: 2px 8px; min-width: 30px; }
/* 警示與紀事 */
#warn { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); top: var(--topH, 44px); margin-top: 8px; display: flex; flex-direction: column; gap: 3px; z-index: 4; max-width: min(300px, 70vw); }
.w { padding: 2px 9px 2px 7px; border-left: 3px solid var(--amber); background: rgba(38,34,29,.9); cursor: pointer; font-size: 12.5px; border-radius: 0 2px 2px 0; }
.w.l2 { border-left-color: var(--madder); color: #f0c8b8; } .w.l0 { border-left-color: var(--moss); }
#feed { position: absolute; left: max(16px, env(safe-area-inset-left, 0px)); bottom: calc(var(--barH, 96px) + 10px); display: flex; flex-direction: column; gap: 3px; z-index: 3; max-width: min(380px, 78vw); pointer-events: none; }
.f { padding: 2px 9px; background: rgba(28,24,20,.78); border-radius: 2px; font-size: 12.5px; pointer-events: auto; cursor: pointer; transition: opacity 1.2s; }
.f.bad { color: #eeb9a6; } .f.good { color: #c5d6a4; } .f.birth { color: #e6d9a0; } .f.death { color: #b8b0a4; } .f.fade { opacity: 0; }

#panel { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: var(--topH, 44px); margin-top: 8px; width: min(310px, calc(100vw - 32px)); max-height: calc(100% - var(--topH, 44px) - var(--barH, 96px) - 26px); overflow: auto; padding: 10px 12px 12px; z-index: 6; -webkit-user-select: text; user-select: text; }
#panel h2 { font-size: 16px; margin: 0 22px 2px 0; font-weight: 900; letter-spacing: .08em; text-wrap: balance; }
#panel .sub { color: var(--dim); font-size: 12px; margin-bottom: 6px; }
#panel .x { position: absolute; right: 6px; top: 6px; padding: 0 7px; }
.row { display: flex; justify-content: space-between; gap: 8px; align-items: center; padding: 2px 0; border-top: 1px dotted rgba(120,105,80,.35); }
.row > span:first-child { color: var(--dim); white-space: nowrap; } .row > :last-child { text-align: right; min-width: 0; }
.bar { height: 7px; background: var(--ink); border: 1px solid var(--edge); border-radius: 1px; width: 120px; display: inline-block; vertical-align: middle; }
.bar > i { display: block; height: 100%; background: var(--moss); } .bar.w2 > i { background: var(--amber); } .bar.w3 > i { background: var(--madder); }
.btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 7px; } .step { display: inline-flex; gap: 3px; align-items: center; } .step button { padding: 0 7px; }
.lnk { color: var(--ochre); cursor: pointer; text-decoration: underline dotted; }
.inv { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 1px 10px; margin-top: 4px; } .inv span { color: var(--dim); }
h3 { font-size: 12px; margin: 9px 0 2px; color: var(--ochre); letter-spacing: .14em; font-weight: 600; }
/* 工具列 */

#tip { pointer-events: none; padding: 3px 12px; font-size: 12.5px; max-width: min(640px, 100%); text-align: center; }
#tip b { color: var(--ochre); } #tip .bad { color: #eeb09a; }
#sub, #cats { pointer-events: auto; display: flex; gap: 4px; max-width: 100%; overflow-x: auto; padding: 5px; scrollbar-width: thin; }
.seal { display: flex; flex-direction: column; align-items: center; gap: 1px; min-width: 54px; padding: 3px 5px 2px; background: var(--wood2); border: 1px solid var(--edge); }
.seal em { font-style: normal; font-weight: 900; font-size: 19px; line-height: 26px; width: 28px; height: 28px; text-align: center; border: 1.5px solid var(--edge2); border-radius: 2px; background: #1e1a16; color: var(--parch); }
.seal span { font-size: 11px; white-space: nowrap; color: var(--dim); } .seal.on { border-color: var(--ochre); background: var(--wood3); } .seal.on em { border-color: var(--ochre); color: var(--ochre); } .seal.on span { color: var(--parch); }
#sub .seal { min-width: 62px; } #sub .seal small { font-size: 10px; color: var(--dim); white-space: nowrap; }

.win { width: min(760px, 100%); max-height: 100%; overflow: auto; padding: 16px 20px 18px; position: relative; -webkit-user-select: text; user-select: text; }
.win h1 { font-size: 20px; margin: 0 30px 8px 0; letter-spacing: .14em; font-weight: 900; } .win .x { position: absolute; right: 10px; top: 10px; }
.tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 10px; }
table { border-collapse: collapse; width: 100%; } th, td { text-align: right; padding: 2px 8px; border-bottom: 1px dotted rgba(120,105,80,.35); font-variant-numeric: tabular-nums; } th:first-child, td:first-child { text-align: left; } th { color: var(--dim); font-weight: 400; font-size: 12px; }
.scrollx { overflow-x: auto; } .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 6px 24px; }

.logl { max-height: 55vh; overflow: auto; } .logl div { padding: 2px 0; border-bottom: 1px dotted rgba(120,105,80,.3); cursor: pointer; } .logl small { color: var(--dim); margin-right: 8px; }

#setup .win { width: min(520px, 100%); }

.opt { display: grid; grid-template-columns: 5.5em 1fr; gap: 5px 10px; align-items: center; } .opt > label { color: var(--dim); } .seg { display: flex; flex-wrap: wrap; gap: 3px; }

.ptab td { white-space: nowrap; } .ptab th.l { text-align: left; }

.prow { cursor: pointer; } .prow:hover td { background: rgba(196,157,79,.1); }

.filebtn { cursor: pointer; background: var(--wood3); border: 1px solid var(--edge); border-radius: 2px; padding: 3px 9px; display: inline-block; } .filebtn:hover { border-color: var(--ochre); }
.ver { font-size: 13px; font-weight: 400; letter-spacing: .04em; color: var(--dim); margin-left: 6px; }

// ───────────────────────── 職業分配與各職業工作行為 ─────────────────────────
function assignJobs() {
  const free = []; let nb = 0; const builders = [];
  for (const c of G.cits) {
    if (!isWorker(c)) { if (c.work) { const b = BI.get(c.work); if (b) b.wk = b.wk.filter(i => i !== c.id); } c.job = 'laborer'; c.work = 0; continue; }
    if (c.job === 'builder') { nb++; builders.push(c); } else if (c.job === 'laborer') free.push(c);
    else { const b = BI.get(c.work); if (!b || b.st !== 'ok' || !b.on || !b.wk.includes(c.id)) { c.job = 'laborer'; c.work = 0; free.push(c); } }
  }
  while (nb > G.builders) { const c = builders.pop(); c.job = 'laborer'; free.push(c); nb--; }
  while (nb < G.builders && free.length) { const c = free.pop(); c.job = 'builder'; c.work = 0; nb++; }
  for (const b of G.bld) {
    const D = BUILD[b.type]; if (!D.max) continue;
    b.wk = b.wk.filter(id => { const c = CI.get(id); return c && c.work === b.id && isWorker(c); });
    const want = (b.st === 'ok' && b.on) ? b.workers : 0;
    while (b.wk.length > want) { const c = CI.get(b.wk.pop()); c.job = 'laborer'; c.work = 0; free.push(c); }
    while (b.wk.length < want && free.length) {
      let bi = 0, bd = 1e9; const needEdu = D.prof === 'teacher' || D.prof === 'physician';
      for (let i = 0; i < free.length; i++) { const c = free[i], h = BI.get(c.home); let d = h ? dist(h.ex, h.ey, b.ex, b.ey) : dist(c.x, c.y, b.ex, b.ey); if (needEdu && !c.edu) d += 500; if (d < bd) { bd = d; bi = i; } }
      const c = free.splice(bi, 1)[0]; c.job = D.prof; c.work = b.id; b.wk.push(c.id);
    }
  }
  G.nLab = free.length; G.nBld = nb;
}
